<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPSUCHT Shopfundkiste</title>
  <link rel="icon" type="image/png" href="op.png" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #080c14;
      --surface:   #0d1525;
      --card:      #111a2e;
      --border:    #1a2e50;
      --accent:    #00c8ff;
      --accent2:   #0077cc;
      --glow:      rgba(0, 200, 255, 0.18);
      --text:      #d6eaf8;
      --muted:     #5b7ba0;
      --white:     #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ─── Background grid ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Header ─── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 20px 32px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(0,119,204,0.08) 0%, transparent 100%);
    }

    header img.logo {
      max-width: 360px;
      width: 90%;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 18px rgba(0,200,255,0.45));
      animation: floatIn 0.7s ease both;
    }

    header h1 {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--white);
      text-shadow: 0 0 20px var(--accent);
      animation: floatIn 0.7s 0.15s ease both;
    }

    header p.subtitle {
      margin-top: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      animation: floatIn 0.7s 0.25s ease both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Search / Filter bar ─── */
    .controls {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 32px auto 0;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      animation: floatIn 0.7s 0.35s ease both;
    }

    .controls input,
    .controls select {
      flex: 1 1 200px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .controls input::placeholder { color: var(--muted); }
    .controls input:focus,
    .controls select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,255,0.12);
    }

    .controls select option { background: var(--surface); }

    /* ─── Stats bar ─── */
    .stats-bar {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 16px auto 0;
      padding: 0 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .stats-bar span { color: var(--accent); font-weight: 700; }

    /* ─── Grid ─── */
    .grid {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 28px auto 48px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    /* ─── Card ─── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      animation: cardIn 0.5s ease both;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,200,255,0.4);
      box-shadow: 0 8px 32px rgba(0,200,255,0.12), 0 2px 8px rgba(0,0,0,0.4);
    }

    .card:hover::before { opacity: 1; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .card-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0,200,255,0.3);
    }

    .card-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
    }

    .field:last-child { margin-bottom: 0; }

    .field-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.68rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .field-value {
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text);
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      padding: 4px 8px;
      border-left: 2px solid var(--accent2);
    }

    /* ─── Shopart badge ─── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(0,200,255,0.12);
      border: 1px solid rgba(0,200,255,0.3);
      color: var(--accent);
    }

    /* ─── Empty / loading states ─── */
    .state-msg {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }

    /* ─── Footer ─── */
    footer {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 20px;
      text-align: center;
      border-top: 1px solid var(--border);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    footer strong { color: rgba(0,200,255,0.5); }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <img class="logo" src="opsucht.png" alt="OPSUCHT" />
    <h1>Shopfundkiste</h1>
    <p class="subtitle">// community shop directory //</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="🔍  Shop suchen …" />
    <select id="filterType">
      <option value="">Alle Shoparts</option>
    </select>
  </div>

  <p class="stats-bar" id="statsBar"></p>

  <div class="grid" id="grid"></div>
  <div class="state-msg" id="stateMsg" style="display:none;"></div>

  <footer>
    <strong>⚠ We are not affiliated with OPSUCHT</strong> &nbsp;·&nbsp; Diese Seite ist kein offizielles OPSUCHT-Projekt.
  </footer>

  <script>
    const ICONS = {
      default: '🛒',
      ressourcen: '⛏️',
      ausrüstung: '⚔️',
      werkzeuge: '🔧',
      essen: '🍖',
      farm: '🌾',
      redstone: '🔴',
      bau: '🧱',
      enchanting: '✨',
    };

    function getIcon(type = '') {
      const key = type.toLowerCase().trim();
      return ICONS[key] || ICONS.default;
    }

    async function loadShops() {
      try {
        const res = await fetch('shops.json');
        if (!res.ok) throw new Error('shops.json nicht gefunden');
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function buildFilter(shops) {
      const types = [...new Set(shops.map(s => s.shopart).filter(Boolean))].sort();
      const sel = document.getElementById('filterType');
      types.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        sel.appendChild(opt);
      });
    }

    function renderCards(shops) {
      const grid = document.getElementById('grid');
      const msg  = document.getElementById('stateMsg');
      const stats = document.getElementById('statsBar');
      grid.innerHTML = '';

      if (!shops.length) {
        grid.style.display = 'none';
        msg.style.display = 'block';
        msg.textContent = '// keine Shops gefunden //';
        stats.textContent = '';
        return;
      }

      grid.style.display = 'grid';
      msg.style.display = 'none';
      stats.innerHTML = `<span>${shops.length}</span> Shop${shops.length !== 1 ? 's' : ''} gefunden`;

      shops.forEach((shop, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${i * 0.07}s`;
        card.innerHTML = `
          <div class="card-header">
            <div class="card-icon">${getIcon(shop.shopart)}</div>
            <div class="card-name">${esc(shop.name || '—')}</div>
          </div>
          <div class="field">
            <span class="field-label">Inhaber</span>
            <span class="field-value">${esc(shop.inhaber || '—')}</span>
          </div>
          <div class="field">
            <span class="field-label">Shopart</span>
            <span class="badge">${esc(shop.shopart || '—')}</span>
          </div>
          <div class="field">
            <span class="field-label">Fundort</span>
            <span class="field-value">📍 ${esc(shop.fundort || '—')}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let allShops = [];

    function applyFilters() {
      const query  = document.getElementById('searchInput').value.toLowerCase();
      const type   = document.getElementById('filterType').value.toLowerCase();
      const result = allShops.filter(s => {
        const matchQ = !query || [s.name, s.inhaber, s.shopart, s.fundort]
          .some(v => v && v.toLowerCase().includes(query));
        const matchT = !type || (s.shopart || '').toLowerCase() === type;
        return matchQ && matchT;
      });
      renderCards(result);
    }

    (async () => {
      const msg = document.getElementById('stateMsg');
      msg.style.display = 'block';
      msg.textContent = '// Lade Shops …  //';

      const shops = await loadShops();

      if (!shops) {
        msg.textContent = '// Fehler: shops.json konnte nicht geladen werden. //';
        return;
      }

      allShops = shops;
      buildFilter(allShops);
      renderCards(allShops);

      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('filterType').addEventListener('change', applyFilters);
    })();
  </script>

</body>
</html>
